<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Manager - Financial Expense Control</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Environment variables will be loaded from env.js -->
    <script src="env.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-credit-card"></i> Subscription Manager</h1>
            <p class="subtitle">Control Your Monthly Financial Expenses</p>
            <div class="exchange-rate-info" id="exchangeRateInfo"></div>
        </header>

        <div class="dashboard">
            <div class="stats-grid">
                <div class="stat-card total">
                    <div class="stat-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Monthly Total Expense</h3>
                        <p class="stat-value" id="totalExpense">¥0</p>
                    </div>
                </div>
                <div class="stat-card count">
                    <div class="stat-icon">
                        <i class="fas fa-list"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Subscription Count</h3>
                        <p class="stat-value" id="subscriptionCount">0</p>
                    </div>
                </div>
                <div class="stat-card average">
                    <div class="stat-icon">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Average Cost</h3>
                        <p class="stat-value" id="averageExpense">¥0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="controls">
                <div class="left-controls">
                    <button class="btn btn-primary" id="addSubscriptionBtn">
                        <i class="fas fa-plus"></i> Add Subscription
                    </button>
                    <button class="btn btn-secondary" id="updateRatesBtn">
                        <i class="fas fa-sync-alt"></i> Update Exchange Rates
                    </button>

                </div>
                <div class="filter-controls">
                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="streaming">Streaming</option>
                        <option value="software">Software</option>
                        <option value="cloud">Cloud Services</option>
                        <option value="gaming">Gaming</option>
                        <option value="education">Education</option>
                        <option value="other">Other</option>
                    </select>
                    <select id="statusFilter">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="Search subscriptions...">
                </div>
            </div>

            <div class="subscriptions-grid" id="subscriptionsGrid">
                <!-- Subscription cards will be dynamically generated here -->
            </div>
            

        </div>
    </div>

    <!-- Add/Edit Subscription Modal -->
    <div class="modal" id="subscriptionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Subscription</h2>
                <button class="close-btn" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="subscriptionForm">
                <div class="form-group">
                    <label for="serviceName">Service Name</label>
                    <input type="text" id="serviceName" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="streaming">Streaming</option>
                        <option value="software">Software</option>
                        <option value="cloud">Cloud Services</option>
                        <option value="gaming">Gaming</option>
                        <option value="education">Education</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency" required>
                        <option value="MYR">Malaysian Ringgit (RM)</option>
                        <option value="USD">US Dollar ($)</option>
                        <option value="CNY">Chinese Yuan (¥)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Subscription Status</label>
                    <select id="status" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="monthlyPrice">Monthly Price</label>
                    <input type="number" id="monthlyPrice" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label for="billingCycle">Billing Cycle</label>
                    <select id="billingCycle">
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                        <option value="quarterly">Quarterly</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nextBilling">Next Billing Date</label>
                    <input type="date" id="nextBilling" required>
                </div>
                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';
        
        // Check if environment variables are loaded
        function checkEnvironmentVariables() {
            console.log('Checking environment variables...');
            console.log('window.ENV:', window.ENV);
            
            if (!window.ENV) {
                throw new Error('Environment variables not loaded. Please check if env.js is properly loaded.');
            }
            
            const requiredVars = [
                'VITE_FIREBASE_API_KEY',
                'VITE_FIREBASE_AUTH_DOMAIN', 
                'VITE_FIREBASE_DATABASE_URL',
                'VITE_FIREBASE_PROJECT_ID'
            ];
            
            const missingVars = requiredVars.filter(varName => !window.ENV[varName]);
            
            if (missingVars.length > 0) {
                throw new Error(`Missing required environment variables: ${missingVars.join(', ')}`);
            }
            
            console.log('✅ All required environment variables are present');
            return true;
        }
        
        // Firebase configuration - Using environment variables only
        function getFirebaseConfig() {
            return {
                apiKey: window.ENV.VITE_FIREBASE_API_KEY,
                authDomain: window.ENV.VITE_FIREBASE_AUTH_DOMAIN,
                databaseURL: window.ENV.VITE_FIREBASE_DATABASE_URL,
                projectId: window.ENV.VITE_FIREBASE_PROJECT_ID,
                storageBucket: window.ENV.VITE_FIREBASE_STORAGE_BUCKET,
                messagingSenderId: window.ENV.VITE_FIREBASE_MESSAGING_SENDER_ID,
                appId: window.ENV.VITE_FIREBASE_APP_ID,
                measurementId: window.ENV.VITE_FIREBASE_MEASUREMENT_ID
            };
        }
        
        // Initialize Firebase with error handling
        async function initializeFirebase() {
            try {
                // Check environment variables first
                checkEnvironmentVariables();
                
                // Get Firebase configuration
                const firebaseConfig = getFirebaseConfig();
                console.log('Firebase config loaded:', {
                    ...firebaseConfig,
                    apiKey: firebaseConfig.apiKey ? '***' + firebaseConfig.apiKey.slice(-4) : 'missing'
                });
                
                // Initialize Firebase
                console.log('Initializing Firebase...');
                const app = initializeApp(firebaseConfig);
                const database = getDatabase(app);
                
                // Test database connection
                console.log('Testing database connection...');
                
                // Expose Firebase instances to global scope
                window.firebaseApp = app;
                window.firebaseDatabase = database;
                window.firebaseInitialized = true;
                window.firebaseError = null;
                
                console.log('✅ Firebase initialization completed successfully');
                
                // Trigger custom event to notify Firebase is initialized
                window.dispatchEvent(new CustomEvent('firebaseReady'));
                
            } catch (error) {
                console.error('❌ Firebase initialization failed:', error);
                window.firebaseInitialized = false;
                window.firebaseError = error;
                
                // Show user-friendly error message
                const errorMessage = `Firebase initialization failed: ${error.message}`;
                console.error(errorMessage);
                
                // Trigger error event
                window.dispatchEvent(new CustomEvent('firebaseError', { detail: error }));
            }
        }
        
        // Wait for DOM and env.js to load, then initialize Firebase
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeFirebase);
        } else {
            // If DOM is already loaded, wait a bit for env.js to load
            setTimeout(initializeFirebase, 100);
        }
    </script>
    
    <!-- Load main script after Firebase initialization -->
    <script src="script.js"></script>
</body>
</html>
